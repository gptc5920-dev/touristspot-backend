providers = ["python"]

[variables]
PORT = "8000"

[phases.setup]
# Nixpacks adds Python and GCC through Nix. Ubuntu's MySQL development package
# exposes pkg-config metadata on the standard system path used by mysqlclient.
aptPkgs = ["...", "default-libmysqlclient-dev", "pkg-config"]

[start]
cmd = "sh deploy/start.sh"
